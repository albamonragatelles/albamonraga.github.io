<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alba Monraga Telles - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c2c2c;
            --accent-color: #d4a574;
            --bg-color: #faf8f5;
            --text-color: #333333;
            --light-text: #666666;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(250, 248, 245, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 1.5rem 0;
            border-bottom: 1px solid rgba(44, 44, 44, 0.1);
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--primary-color);
            text-decoration: none;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        .nav-logo:hover {
            color: var(--accent-color);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 3rem;
        }

        .nav-link {
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--text-color);
            text-decoration: none;
            letter-spacing: 1px;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--accent-color);
        }

        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }

        /* Hamburger Menu */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .bar {
            width: 25px;
            height: 2px;
            background-color: var(--primary-color);
            transition: all 0.3s ease;
        }

        /* Hero Section */
        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 8rem 2rem 4rem;
        }

        .hero-content {
            text-align: center;
            z-index: 10;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 300;
            color: var(--primary-color);
            line-height: 1.2;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }

        .title-line {
            display: block;
            animation: fadeInUp 1s ease-out;
        }

        .title-line:nth-child(2) {
            animation-delay: 0.2s;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        .hero-subtitle {
            font-size: clamp(1rem, 2vw, 1.3rem);
            color: var(--light-text);
            margin-bottom: 3rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
            animation: fadeInUp 1s ease-out 0.4s;
            animation-fill-mode: forwards;
            opacity: 0;
        }

        .cta-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-decoration: none;
            color: var(--white);
            background-color: var(--primary-color);
            border: 2px solid var(--primary-color);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 1s ease-out 0.6s;
            animation-fill-mode: forwards;
            opacity: 0;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background-color: var(--accent-color);
            transition: left 0.4s ease;
            z-index: -1;
        }

        .cta-button:hover::before {
            left: 0;
        }

        .cta-button:hover {
            border-color: var(--accent-color);
            color: var(--white);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212, 165, 116, 0.3);
        }

        /* Decorative Elements */
        .decorative-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        .circle {
            position: absolute;
            border: 1px solid rgba(212, 165, 116, 0.2);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .circle-1 {
            width: 400px;
            height: 400px;
            top: 10%;
            right: 5%;
            animation-delay: 0s;
        }

        .circle-2 {
            width: 250px;
            height: 250px;
            bottom: 15%;
            left: 8%;
            animation-delay: 2s;
        }

        .line {
            position: absolute;
            width: 2px;
            height: 150px;
            background: linear-gradient(to bottom, transparent, rgba(212, 165, 116, 0.3), transparent);
            animation: float 4s ease-in-out infinite;
        }

        .line-1 {
            top: 20%;
            left: 15%;
            transform: rotate(15deg);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        /* Responsive Design */
        @media screen and (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .nav-menu {
                position: fixed;
                left: -100%;
                top: 70px;
                flex-direction: column;
                background-color: rgba(250, 248, 245, 0.98);
                width: 100%;
                text-align: center;
                transition: left 0.3s ease;
                padding: 2rem 0;
                gap: 2rem;
                border-bottom: 1px solid rgba(44, 44, 44, 0.1);
            }

            .nav-menu.active {
                left: 0;
            }

            .hamburger.active .bar:nth-child(1) {
                transform: rotate(45deg) translate(8px, 5px);
            }

            .hamburger.active .bar:nth-child(2) {
                opacity: 0;
            }

            .hamburger.active .bar:nth-child(3) {
                transform: rotate(-45deg) translate(8px, -5px);
            }

            .circle-1 {
                width: 250px;
                height: 250px;
            }

            .circle-2 {
                width: 150px;
                height: 150px;
            }

            .hero-section {
                padding: 6rem 1rem 3rem;
            }
        }

        @media screen and (max-width: 480px) {
            .nav-logo {
                font-size: 1.5rem;
            }

            .hero-title {
                font-size: 2.5rem;
            }

            .hero-subtitle {
                font-size: 0.9rem;
                letter-spacing: 2px;
            }

            .cta-button {
                padding: 0.9rem 2rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="nav-logo">AMT</a>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link active">Home</a>
                </li>
                <li class="nav-item">
                    <a href="#portfolio" class="nav-link">Portfolio</a>
                </li>
                <li class="nav-item">
                    <a href="#resume" class="nav-link">Resume</a>
                </li>
                <li class="nav-item">
                    <a href="#contact" class="nav-link">Contact</a>
                </li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">
                <span class="title-line">Alba</span>
                <span class="title-line">Monraga Telles</span>
            </h1>
            <p class="hero-subtitle">Student at Brown University</p>
            <a href="#portfolio" class="cta-button">View My Work</a>
        </div>
        <div class="decorative-elements">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="line line-1"></div>
        </div>
    </main>

    <script>
        // Mobile menu toggle
        const hamburger = document.querySelector('.hamburger');
        const navMenu = document.querySelector('.nav-menu');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        // Close menu when clicking on a link
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('active');
                navMenu.classList.remove('active');
            });
        });
    </script>
</body>
</html>
